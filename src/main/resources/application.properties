spring.application.name=project_demo
spring.application.version=0.0.1

server.servlet.context-path=/demo/api/v1/

server.port=8844

spring.datasource.url=jdbc:mysql://localhost:3306/demo_api?createDatabaseIfNotExist=true
spring.datasource.username=foxder
spring.datasource.password=foxder
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

